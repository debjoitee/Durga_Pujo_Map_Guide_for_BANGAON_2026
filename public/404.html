<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#7f1d1d" />

    <title>Page not found | Bangaon Durga Puja 2026</title>

    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #2b211d;
        background: #fffaf2;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(24px, 6vw, 44px);
        text-align: center;
        background: #fff;
        border: 1px solid #ead9cc;
        border-radius: 24px;
        box-shadow: 0 12px 40px #43241812;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #8b2c24;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.1;
      }

      p {
        line-height: 1.65;
        color: #65564d;
      }

      a {
        display: inline-block;
        margin-top: 12px;
        padding: 13px 20px;
        border-radius: 12px;
        background: #7f1d1d;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #d69b39;
        outline-offset: 4px;
      }
    </style>
  </head>

  <body>
    <main>
      <p class="eyebrow">Bangaon Durga Puja 2026</p>

      <h1>404 — Page not found</h1>

      <p>
        The page you requested does not exist or may have moved.
        You can return to the Puja pandal guide and search for a pandal there.
      </p>

      <a href="/">Back to the Puja guide</a>
    </main>
  </body>
</html>
